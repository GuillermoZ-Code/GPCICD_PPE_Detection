# =============================================================================
# GitLab CI/CD — GPCICD PPE Detection (M4)
#
# HU-066: stages, cachés y reglas.
# HU-067: job `build_image` con Docker-in-Docker.
# HU-068: publicación en el registry de GitLab y, opcionalmente, en Docker Hub.
#
# El repositorio se espeja desde GitHub (HU-065): GitLab ejecuta el pipeline
# sobre el mismo SHA que revisó el equipo. GitHub sigue siendo la fuente de
# verdad; aquí solo se valida y se empaqueta.
#
# Variables que deben existir como CI/CD variables (masked / protected):
#   DOCKERHUB_USER, DOCKERHUB_TOKEN  — opcionales; sin ellas no se publica en
#                                      Docker Hub y el job sigue en verde.
#   DEPLOY_HOST, DEPLOY_USER, SSH_KEY — las usa el job `deploy` (HU-070).
# =============================================================================

variables:
  # Imagen oficial de uv: mismo Python y misma base que el Dockerfile.
  UV_VERSION: "0.13.9"
  PYTHON_VERSION: "3.13"
  BASE_LAYER: trixie-slim

  # Reproducibilidad: uv respeta uv.lock y no reescribe el entorno.
  UV_LINK_MODE: copy
  UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache
  UV_FROZEN: "1"
  UV_PYTHON_DOWNLOADS: never
  PYTHONUNBUFFERED: "1"
  PYTEST_ADDOPTS: "--junitxml=report.xml"

  # El espejo ya trae el histórico; un clon superficial basta y ahorra minutos.
  GIT_DEPTH: "1"

  # Imágenes del proyecto: backend (API + gRPC) y SPA servida por nginx.
  API_IMAGE: $CI_REGISTRY_IMAGE/api
  WEB_IMAGE: $CI_REGISTRY_IMAGE/web

  DOCKER_TLS_CERTDIR: "/certs"

image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER

workflow:
  # Dos pushes seguidos: se cancela el pipeline viejo, que ya no informa nada.
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # Un tag no dispara pipeline: el espejo solo empuja ramas y el release se
    # construye desde `main`.
    - if: $CI_COMMIT_TAG
      when: never
    # Merge requests de GitLab, si algún día se usan.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Push a una rama con MR abierto: no duplicar el pipeline del MR.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - quality
  - test
  - package

default:
  timeout: 20 minutes
  interruptible: true
  cache:
    # El cache se invalida solo cuando cambian las dependencias.
    key:
      files:
        - pyproject.toml
        - uv.lock
      # Un cache por job: `lint` instala solo el grupo dev y `test` el entorno
      # completo; con una clave compartida se pisarían entre ellos.
      prefix: $CI_JOB_NAME
    paths:
      - .uv-cache/

# -----------------------------------------------------------------------------
# Calidad: Ruff, sin instalar el entorno completo (feedback barato).
# -----------------------------------------------------------------------------
lint:
  stage: quality
  script:
    - uv sync --only-group dev --no-install-project
    - uv run --no-sync ruff check .
    - uv run --no-sync ruff format --check .

# -----------------------------------------------------------------------------
# Tipos: `ty` necesita el paquete instalado, así que resuelve el entorno.
# -----------------------------------------------------------------------------
types:
  stage: quality
  script:
    - uv sync --all-groups
    - uv run --no-sync ty check

# -----------------------------------------------------------------------------
# Gobernanza: valida que cada spec tenga spec.md, plan.md y tasks.md (HU-096).
# -----------------------------------------------------------------------------
specs:
  stage: quality
  script:
    - uv sync --all-groups
    - uv run --no-sync python -m ppe_detection.tools.check_specs --check

# -----------------------------------------------------------------------------
# Pruebas: el paquete importa OpenCV, que enlaza libGL y X11 al cargarse.
# En Debian 13 la transición t64 renombró libglib2.0-0 a libglib2.0-0t64.
# -----------------------------------------------------------------------------
test:
  stage: test
  before_script:
    - apt-get update -qq
    - >-
      apt-get install -y -qq --no-install-recommends
      libgl1 libglib2.0-0t64 libxcb1 libx11-6 libxext6 libsm6 libxrender1
    - rm -rf /var/lib/apt/lists/*
  script:
    - uv sync --all-groups
    - uv run --no-sync pytest
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: report.xml

# -----------------------------------------------------------------------------
# Frontend: ESLint, Vitest y build de la SPA (HU-007, HU-072).
# -----------------------------------------------------------------------------
frontend:
  stage: test
  image: node:24-alpine
  cache:
    key:
      files:
        - frontend/package-lock.json
      prefix: frontend
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci
    - npm run lint
    - npm run test
    - npm run build
  artifacts:
    expire_in: 1 week
    paths:
      - frontend/dist/

# -----------------------------------------------------------------------------
# Imágenes: se construyen solo en la rama por defecto (o a mano desde la UI).
# Cualquier rama que construyera pisaría `:latest` y la imagen "oficial"
# dejaría de ser la de `main`.
# -----------------------------------------------------------------------------
build_image:
  stage: package
  image: docker:29.10.0-cli
  services:
    - docker:29.10.0-dind
  # No usa uv ni genera .uv-cache/: heredar el cache global solo produce
  # "file does not exist" al restaurar.
  cache: {}
  timeout: 45 minutes
  needs:
    - lint
    - types
    - specs
    - test
    - frontend
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # En una rama de trabajo la imagen se construye solo a mano: sirve para
    # probar el Dockerfile sin pisar `:latest` ni gastar minutos en cada push.
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: manual
  before_script:
    # El registry de GitLab se autentica con el token efímero del job.
    - echo "$CI_JOB_TOKEN" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    # `|| true`: en el primer build todavía no existe `:latest`.
    - docker pull -q "$API_IMAGE:latest" > /dev/null 2>&1 || true
    - docker pull -q "$WEB_IMAGE:latest" > /dev/null 2>&1 || true
    - >-
      docker build
      --target runtime
      --cache-from $API_IMAGE:latest
      --build-arg BUILDKIT_INLINE_CACHE=1
      -t $API_IMAGE:$CI_COMMIT_SHORT_SHA
      -t $API_IMAGE:latest
      .
    - >-
      docker build
      --target web
      --cache-from $WEB_IMAGE:latest
      --build-arg BUILDKIT_INLINE_CACHE=1
      -t $WEB_IMAGE:$CI_COMMIT_SHORT_SHA
      -t $WEB_IMAGE:latest
      .
    # Smoke: la imagen tiene que importar el paquete y construir la app sin
    # modelo montado (la API responderá 503 hasta que exista el artefacto).
    - >-
      docker run --rm --entrypoint python $API_IMAGE:$CI_COMMIT_SHORT_SHA
      -c "from ppe_detection.api import create_app; app = create_app(); print('smoke ok', app.version)"
    - docker push $API_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $API_IMAGE:latest
    - docker push $WEB_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $WEB_IMAGE:latest
    # HU-068 AC-03: el digest queda como artefacto del job, para poder
    # desplegar exactamente lo que se publicó.
    - docker image inspect --format '{{index .RepoDigests 0}}' $API_IMAGE:$CI_COMMIT_SHORT_SHA > api-digest.txt
    - docker image inspect --format '{{index .RepoDigests 0}}' $WEB_IMAGE:$CI_COMMIT_SHORT_SHA > web-digest.txt
    - cat api-digest.txt web-digest.txt
    # HU-068 AC-02: Docker Hub solo si hay credenciales; el Droplet puede
    # bajar la imagen pública sin guardar secretos.
    - |
      if [ -n "${DOCKERHUB_USER:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
        echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin
        docker tag $API_IMAGE:$CI_COMMIT_SHORT_SHA "$DOCKERHUB_USER/gpcicd-ppe-api:$CI_COMMIT_SHORT_SHA"
        docker tag $API_IMAGE:$CI_COMMIT_SHORT_SHA "$DOCKERHUB_USER/gpcicd-ppe-api:latest"
        docker tag $WEB_IMAGE:$CI_COMMIT_SHORT_SHA "$DOCKERHUB_USER/gpcicd-ppe-web:$CI_COMMIT_SHORT_SHA"
        docker tag $WEB_IMAGE:$CI_COMMIT_SHORT_SHA "$DOCKERHUB_USER/gpcicd-ppe-web:latest"
        docker push "$DOCKERHUB_USER/gpcicd-ppe-api:$CI_COMMIT_SHORT_SHA"
        docker push "$DOCKERHUB_USER/gpcicd-ppe-api:latest"
        docker push "$DOCKERHUB_USER/gpcicd-ppe-web:$CI_COMMIT_SHORT_SHA"
        docker push "$DOCKERHUB_USER/gpcicd-ppe-web:latest"
      else
        echo "Docker Hub sin configurar: se omite la publicación espejo."
      fi
  artifacts:
    expire_in: 1 week
    paths:
      - api-digest.txt
      - web-digest.txt
