name: Propiedad

# Compuerta de propiedad (HU-082): evita que un agente edite archivos de otro
# dueño cuando los cuatro trabajan en paralelo. Falla solo con archivos de un
# solo escritor; el resto son avisos y la revisión la pide CODEOWNERS.

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ownership-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ownership:
    name: Propiedad
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sincronizar entorno
        run: uv sync --all-groups

      - name: Verificar propiedad
        run: >-
          uv run python -m ppe_detection.tools.ownership
          --base "origin/${{ github.base_ref }}"
          --author "${{ github.event.pull_request.user.login }}"
