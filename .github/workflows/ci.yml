name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Calidad
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sincronizar entorno
        run: uv sync --all-groups

      - name: Pre-commit (higiene + Ruff + uv-lock)
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Verificación de tipos (ty)
        run: uv run ty check

      - name: Pruebas
        run: uv run pytest

      - name: Construir paquete
        run: uv build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas
        run: npm run test

      - name: Build
        run: npm run build

  docker:
    name: Docker y Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Construir imagen CPU
        run: docker build --target runtime -t gpcicd-ppe-detection:ci .

      - name: Smoke sin modelo
        run: |
          docker run --rm gpcicd-ppe-detection:ci \
            python -c "from ppe_detection.api import create_app; app = create_app(); print(app.version)"

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@v0.33.0
        with:
          image-ref: gpcicd-ppe-detection:ci
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Publicar reporte
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          if-no-files-found: error
