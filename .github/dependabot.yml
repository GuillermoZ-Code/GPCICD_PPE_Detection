version: 2

updates:
  # Dependencias de Python / uv (pyproject.toml + uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      python:
        patterns:
          - "*"
    labels:
      - chore
      - infra
    commit-message:
      prefix: "chore"

  # Acciones de GitHub usadas en los workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - chore
      - infra
    commit-message:
      prefix: "chore"
