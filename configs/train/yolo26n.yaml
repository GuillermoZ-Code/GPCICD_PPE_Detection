# Configuración de entrenamiento YOLO26n (HU-017).
# Pensada para Colab/Kaggle; los YAML de datos viven en /content.
data: /content/data_colab.yaml
eval_data: /content/data_eval_colab.yaml
model: yolo26n.pt
epochs: 100
imgsz: 640
batch: -1
device: "0"
project: /content/runs/train
name: yolo26n_clean
seed: 42
