# HU-011 — servidor estático de la SPA (build de Vite, target `web`).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta cae en index.html (enrutado del lado del cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash en el nombre: caché larga del navegador.
    location /assets/ {
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
