# HU-011 — servidor estático de la SPA (build de Vite, target `web`).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # HU-072 — API en el mismo origen: la SPA llama a /api/* y nginx reenvía al
    # servicio `api` de compose sin el prefijo (`/api/predict` → `/predict`).
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: cualquier ruta cae en index.html (enrutado del lado del cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash en el nombre: caché larga del navegador.
    location /assets/ {
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
